# Dev leave-one-out fold (split v1, see configs/README.md): the dev set minus Panc1_200U.
# Train on the other 4, then evaluate on Panc1_200U with its eval config.
# Single-cell training, 5kb context, 100 fibers per sample. Target assays come from the model config's output_assays.

context_length: 5000
fibers_per_entry: 100
dataset_type: single

# Regions (configs/README.md, Regions). Training: half cCRE centres (+-200 bp jitter), half uniform random regions,
# on train_chrs (reference.yaml). Validation: fixed chr22 window set.
train_windows: {sources: {ccre: 0.5, random: 0.5}, jitter: 200}
val_windows: val_chr22_n200

cell_types:
  GM12878:
  K562_200U:
  HepG2_200U:
  H1_200U:
