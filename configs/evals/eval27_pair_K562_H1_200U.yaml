# Paired eval for the unseen-pair test (T3b): K562_200U (A) and H1_200U (B), each cell type's fibers alone at every
# valid chr21 tile (test_chr21_tiles). Unseen pair for main model A (GM12878 + HepG2, data28); seen pair for main
# model B (data34). Differential r, sign accuracy and fiber-origin AUC at the K562 vs H1 differential bins (no ATAC:
# H1 has none). Breakdown by the pairwise loci and each cell type's dev loci.

context_length: 5000
fibers_per_entry: 100
windows: test_chr21_tiles
seed: 919
dataset_type: single
paired: true
pair_loci: pairs/K562__H1
loci: [pairs/K562__H1, "dev/{line}"]

cell_types:
  K562_200U:
  H1_200U:
