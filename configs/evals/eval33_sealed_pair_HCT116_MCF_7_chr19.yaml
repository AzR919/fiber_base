# SEALED TEST (reports/sealed_test_protocol.md P1, P3, P4; secondary T3 readouts): HCT116_200U (A) and MCF_7_200U (B),
# each cell type's fibers alone at every valid chr19 tile (test_chr19_tiles). Own-track r per cell (with --baseline
# --mixture_reference: the floor "bulk on every molecule"); paired: differential r, sign accuracy and fiber-origin AUC
# at the HCT116 vs MCF-7 differential bins on chr19 (loci pairs/HCT116__MCF-7, from bulk only). Run once per model.

context_length: 5000
fibers_per_entry: 100
windows: test_chr19_tiles
seed: 919
dataset_type: single
paired: true
pair_loci: pairs/HCT116__MCF-7
loci: [pairs/HCT116__MCF-7]

cell_types:
  HCT116_200U:
  MCF_7_200U:
