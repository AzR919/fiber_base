# Mixture composites, MINI, as data36 trains them: GM12878 + HepG2_200U fibers pooled at each of the 2,000
# test_chr21_mini2000 tiles, GM12878's share fixed at 0.5 with balanced stacks (tiles below 10 fibers skipped), scored
# against the mixture target. eval26 is the same with the share drawn from [0.2, 0.8]; run both for every model.

context_length: 5000
fibers_per_entry: 100
windows: test_chr21_mini2000
seed: 919
dataset_type: mixed
mix_range: [0.5, 0.5]
mix_balance: true
mix_min_fibers: 10

cell_types:
  GM12878:
  HepG2_200U:
