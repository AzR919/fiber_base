# Dry run of the random-split control on a dev pair (reports/sealed_test_protocol.md §7 step 3): HepG2_200U's fibers
# split into two random halves by read name, chr21 mini tiles, AUC at the GM12878 vs HepG2 differential bins. Compare
# with the library control eval25 (HepG2_100U vs 200U): both should give AUC ~0.5.

context_length: 5000
fibers_per_entry: 100
windows: test_chr21_mini2000
seed: 919
dataset_type: single
paired: true
pair_loci: pairs/GM12878__HepG2
loci: [pairs/GM12878__HepG2]

cell_types:
  HepG2_200U_h0: {sample: HepG2_200U, read_half: 0}
  HepG2_200U_h1: {sample: HepG2_200U, read_half: 1}
