# Debug/test paired eval (smoke tests of eval24-style configs): GM12878 (A) + HepG2_200U (B) on 20 tiles of
# test_chr21_tiles, 5kb context, 100 fibers, with the pairwise and dev loci breakdowns.

context_length: 5000
fibers_per_entry: 100
windows: test_chr21_tiles
max_regions: 20
seed: 919
dataset_type: single
paired: true
pair_loci: pairs/GM12878__HepG2
loci: [pairs/GM12878__HepG2, "dev/{line}"]

cell_types:
  GM12878:
  HepG2_200U:
