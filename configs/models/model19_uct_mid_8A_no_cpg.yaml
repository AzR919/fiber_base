# CpG ablation (reports/TODO_extended.md T10): identical to model15_uct_mid_8A but without the CpG methylation input.
# UNet03 conv-transformer, MID, all 8 assays. Inputs [m6a, msp, nuc, fire_msp] + reference DNA. Fits in a 2g.20gb
# MIG slice. With this model the fiber's measured CpG methylation is held-out data (T5a).

model: "unet03"
input_flags: [1, 0, 1, 1, 1]
kernel_size: 15
dna_type: "ref"
tf_heads: 4
tf_layers: 2
emb_dims: [8, 24, 48, 96]
output_assays: ["atac", "h3k4me3", "h3k27ac", "h3k27me3", "h3k4me1", "h3k36me3", "h3k9me3", "ctcf"]
