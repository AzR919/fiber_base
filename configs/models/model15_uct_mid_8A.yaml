# UNet03 conv-transformer, MID (emb_dims 8/24/48/96, 2 transformer layers) — same architecture as model11_uct_mid_all_A,
# predicting all 8 assays from data_prep/encode_spec.yaml. All 5 fiber inputs [m6a, cpg, msp, nuc, fire_msp] + reference DNA.
# Sized for a 2g.20gb MIG slice: ~14.5 GiB peak reserved at batch 8 x 100 fibers x 5000 bp.

model: "unet03"
input_flags: [1, 1, 1, 1, 1]
kernel_size: 15
dna_type: "ref"
tf_heads: 4
tf_layers: 2
emb_dims: [8, 24, 48, 96]
output_assays: ["atac", "h3k4me3", "h3k27ac", "h3k27me3", "h3k4me1", "h3k36me3", "h3k9me3", "ctcf"]
