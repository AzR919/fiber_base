# Baseline ladder rung 4 (reports/TODO_extended.md T11): DEV4NF's network (model16_uct_mid_8A_no_fire_msp) with the
# rung-2 hand-crafted features (handcrafted.FiberFeatures, fiber + reference DNA only, no external annotation) added
# as extra fiber input channels. Does the network already capture what the simple features carry?
# UNet03 conv-transformer, MID, all 8 assays. Inputs [m6a, cpg, msp, nuc] + 30 features + reference DNA.

model: "unet03"
input_flags: [1, 1, 1, 1, 0]
extra_features: true
kernel_size: 15
dna_type: "ref"
tf_heads: 4
tf_layers: 2
emb_dims: [8, 24, 48, 96]
output_assays: ["atac", "h3k4me3", "h3k27ac", "h3k27me3", "h3k4me1", "h3k36me3", "h3k9me3", "ctcf"]
