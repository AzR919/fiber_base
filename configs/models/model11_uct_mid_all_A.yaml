# UNet03 conv-transformer, mid-size (emb_dims 8/24/48/96, 2 transformer layers). All 4 assays (ATAC, H3K4me3, H3K27ac, H3K27me3).
# All 5 fiber inputs [m6a, cpg, msp, nuc, fire_msp] + reference DNA. Fits in a 20GB MIG slice.

model: "unet03"
input_flags: [1, 1, 1, 1, 1]
kernel_size: 15
dna_type: "ref"
tf_heads: 4
tf_layers: 2
emb_dims: [8, 24, 48, 96]
output_assays: ["atac", "h3k4me3", "h3k27ac", "h3k27me3"]
