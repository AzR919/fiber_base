# UNet03 conv-transformer, mid-size (emb_dims 8/24/48/96, 2 transformer layers). ATAC only.
# All 5 fiber inputs + reference DNA. Fits in a 20GB MIG slice.

model: "unet03"
input_flags: [1, 1, 1, 1, 1]
kernel_size: 15
dna_type: "ref"
tf_heads: 4
tf_layers: 2
emb_dims: [8, 24, 48, 96]
output_assays: ["atac"]
