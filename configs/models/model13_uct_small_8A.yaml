# UNet03 conv-transformer, SMALL (emb_dims 8/16/32/64, 2 transformer layers). All 8 assays from data_prep/encode_spec.yaml.
# All 5 fiber inputs [m6a, cpg, msp, nuc, fire_msp] + reference DNA.
# Sized for a 1g.10gb MIG slice: ~9.4 GiB peak reserved of 9.75 at batch 8 x 100 fibers x 5000 bp (tight; fallback is 8/12/24/48 at ~7.9 GiB), 0.30M params.

model: "unet03"
input_flags: [1, 1, 1, 1, 1]
kernel_size: 15
dna_type: "ref"
tf_heads: 4
tf_layers: 2
emb_dims: [8, 16, 32, 64]
output_assays: ["atac", "h3k4me3", "h3k27ac", "h3k27me3", "h3k4me1", "h3k36me3", "h3k9me3", "ctcf"]
