# fire_msp ablation: identical to model11_uct_mid_all_A but without the fire_msp input.
# UNet03 conv-transformer, mid-size, all 4 assays. Inputs [m6a, cpg, msp, nuc] + reference DNA. Fits in a 20GB MIG slice.

model: "unet03"
input_flags: [1, 1, 1, 1, 0]
kernel_size: 15
dna_type: "ref"
tf_heads: 4
tf_layers: 2
emb_dims: [8, 24, 48, 96]
output_assays: ["atac", "h3k4me3", "h3k27ac", "h3k27me3"]
