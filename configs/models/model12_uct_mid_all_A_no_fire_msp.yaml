# UNet03 conv-transformer, mid-size — identical to model11_uct_mid_all_A except fire_msp is NOT an input
# (ablation: how much does fire_msp contribute to the predictions?)
# input_flags order: [m6a, cpg, msp, nuc, fire_msp]
# kernel_size=15, tf_layers=2 — fits in 20GB MIG slice

model: "unet03"
input_flags: [1, 1, 1, 1, 0]
kernel_size: 15
dna_type: "ref"
tf_heads: 4
tf_layers: 2
emb_dims: [8, 24, 48, 96]
output_assays: ["atac", "h3k4me3", "h3k27ac", "h3k27me3"]
